<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jornadas – SIGEH</title>
  <meta property="og:title" content="Jornadas | SIGEH" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="layout-navbar">
    <div id="navbar-container"></div>

    <main class="page-body-navbar">
      <header class="page-header">
        <div><h1 class="page-title">Jornadas</h1><p class="page-subtitle">Definí horarios de trabajo para asignarlos al personal.</p></div>
        <button class="btn btn-primary" onclick="ui.abrirModal('modal-jornada')">+ Nueva jornada</button>
      </header>

      <div class="card">
        <div id="tabla-jornadas"></div>
      </div>
    </main>
  </div>

  <!-- Modal nueva jornada -->
  <div id="modal-jornada" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div><h3 class="modal-title">Nueva jornada</h3><p class="card-description">Definí el horario base que se asignará a los empleados.</p></div>
        <button class="modal-close" onclick="ui.cerrarModal('modal-jornada')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="jornada-error" class="alert alert-error"></div>
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input id="f-nombre" type="text" class="form-input" placeholder="Ej: Diurna" />
        </div>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label">Hora inicio</label>
            <input id="f-hora-inicio" type="time" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Hora fin</label>
            <input id="f-hora-fin" type="time" class="form-input" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Horas máximas</label>
          <input id="f-horas-maximas" type="number" class="form-input" placeholder="8" min="1" max="12" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="ui.cerrarModal('modal-jornada')">Cancelar</button>
        <button class="btn btn-primary" onclick="jornadasModule.guardar()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/cookie-consent.js"></script>
  <script src="../js/modules/jornadas.js"></script>
</body>
</html>
