<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistencia – SIGEH</title>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <!-- Tom Select -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
  <div class="layout-navbar">
    <div id="navbar-container"></div>

    <main class="page-body-navbar">
      <div style="margin-bottom:1.25rem;">
        <h1 class="page-title">Asistencia</h1>
      </div>

      <!-- Registrar marcación -->
      <div class="card" style="margin-bottom:1.25rem;">
        <div class="card-header">
          <h2 class="card-title">Registrar marcación</h2>
        </div>
        <div class="card-body" style="display:flex;gap:12px;align-items:flex-end;">
          <div class="form-group" style="flex:1;margin-bottom:0;">
            <label class="form-label">Empleado</label>
            <select id="f-id-empleado" class="form-select"></select>
          </div>
          <button class="btn btn-primary" onclick="asistenciaModule.marcarEntrada()">
            Marcar entrada
          </button>
          <button class="btn btn-secondary" onclick="asistenciaModule.marcarSalida()">
            Marcar salida
          </button>
        </div>
      </div>

      <!-- Filtros -->
      <div class="card" style="margin-bottom:1.25rem;">
        <div class="card-body" style="display:flex;gap:12px;align-items:flex-end;">
          <div class="form-group" style="flex:1;margin-bottom:0;">
            <label class="form-label">Buscar</label>
            <input
              id="filtro-busqueda"
              type="text"
              class="form-input"
              placeholder="Nombre, cédula..."
              oninput="asistenciaModule.filtrar()"
            />
          </div>

          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Estado</label>
            <select
              id="filtro-estado"
              class="form-select"
              onchange="asistenciaModule.filtrar()"
            >
              <option value="">Todos</option>
              <option value="completo">Completo</option>
              <option value="turno">En turno</option>
              <option value="ausente">Ausente</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Fecha</label>
            <input
              id="filtro-fecha"
              type="date"
              class="form-input"
              onchange="asistenciaModule.filtrar()"
            />
          </div>

          <button class="btn btn-secondary" onclick="asistenciaModule.limpiarFiltros()">
            Limpiar
          </button>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Registro de asistencia</h2>
        </div>
        <div id="tabla-asistencia"></div>
      </div>
    </main>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/modules/asistencia.js"></script>
</body>
</html>
