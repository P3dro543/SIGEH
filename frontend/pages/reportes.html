<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes – SIGEH</title>
  <meta property="og:title" content="Reportes | SIGEH" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>

<body>
  <div class="layout-navbar">
    <div id="navbar-container"></div>

    <main class="page-body-navbar">

      <header class="page-header">
        <h1 class="page-title">Reportes</h1>
        <p class="page-subtitle">Consultá indicadores de asistencia y exportá la información necesaria.</p>
      </header>

      <!-- Card de filtros -->
      <div class="card" style="margin-bottom:1.25rem;">
        <div class="card-header">
          <h2 class="card-title">Filtros</h2>
        </div>

        <div class="card-body">

          <!-- Fechas -->
          <div class="form-grid-2" style="margin-bottom:12px;">

            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">Fecha inicio</label>
              <input
                id="f-fecha-inicio"
                type="date"
                class="form-input"
              />
            </div>

            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">Fecha fin</label>
              <input
                id="f-fecha-fin"
                type="date"
                class="form-input"
              />
            </div>

          </div>

          <!-- Área y empleado -->
          <div class="form-grid-2" style="margin-bottom:12px;">

            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">Área</label>

              <select id="f-area" class="form-select">
                <option value="">Todas las áreas</option>
                <option value="1">Vigilancia</option>
                <option value="2">Salud Ocupacional</option>
                <option value="3">Planta</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">Empleado</label>

              <select id="f-empleado" class="form-select">
              </select>
            </div>

          </div>

          <!-- Botones -->
          <div style="display:flex;gap:10px;flex-wrap:wrap;">

            <button
              class="btn btn-primary"
              onclick="reportesModule.cargar()">
              Ver resumen
            </button>

            <button
              class="btn btn-secondary"
              onclick="reportesModule.descargarExcel()">
              Descargar Excel
            </button>

            <button
              class="btn btn-secondary"
              onclick="reportesModule.descargarPDF()">
              Descargar PDF
            </button>

            <button
              class="btn btn-secondary"
              onclick="reportesModule.limpiarFiltros()">
              Limpiar
            </button>

          </div>

        </div>
      </div>

      <!-- Tabla de reportes -->
      <div class="card">

        <div class="card-header">
          <h2 class="card-title">
            Resumen por empleado
          </h2>
        </div>

        <div id="tabla-reportes"></div>

      </div>

    </main>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/cookie-consent.js"></script>
  <script src="../js/modules/reportes.js"></script>

</body>
</html>
