<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reemplazos – SIGEH</title>
  <meta property="og:title" content="Reemplazos | SIGEH" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <script src="../js/auth-guard.js"></script>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <!-- Tom Select -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

  <!-- =====================================================
       ESTILOS DE PÁGINA — Reemplazos
       Solo define clases usadas en este HTML que no existen
       en base.css / components.css / navbar.css. No redefine
       ni sobreescribe ninguna clase ni variable existente.
       ===================================================== -->
  <style>

    /* ENCABEZADO DE PÁGINA */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .page-header .page-title {
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* DESCRIPCIÓN DE TARJETA / MODAL */
    .card-description {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {

      .page-header {
        flex-direction: column;
        align-items: stretch;
      }
    }

  </style>
</head>

<body>
  <div class="layout-navbar">

    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO -->
    <main class="page-body-navbar">

      <!-- ENCABEZADO -->
      <header class="page-header">
        <div>
          <h1 class="page-title">Reemplazos</h1>
          <p class="page-subtitle">Gestiona las asignaciones de empleados sustitutos.</p>
        </div>

        <button class="btn btn-primary" onclick="coberturasModule.abrirModal()">
          + Nuevo reemplazo
        </button>
      </header>

      <!-- TABLA -->
      <section class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title">Reemplazos registrados</h2>
            <p class="card-description">Consulta las coberturas asignadas y pendientes.</p>
          </div>
        </div>

        <div id="tabla-coberturas" class="table-container"></div>
      </section>

    </main>
  </div>

  <!-- ===================================================== -->
  <!-- MODAL — NUEVO REEMPLAZO                                -->
  <!-- ===================================================== -->
  <div id="modal-cobertura" class="modal-overlay">
    <div class="modal">

      <!-- HEADER -->
      <div class="modal-header">
        <div>
          <h3 class="modal-title">Asignar reemplazo</h3>
          <p class="card-description">Selecciona la inconsistencia y el empleado sustituto.</p>
        </div>

        <button class="modal-close" onclick="ui.cerrarModal('modal-cobertura')" aria-label="Cerrar">
          &times;
        </button>
      </div>

      <!-- BODY -->
      <div class="modal-body">

        <div id="cobertura-error" class="alert alert-error"></div>

        <!-- INCONSISTENCIA -->
        <div class="form-group">
          <label class="form-label" for="f-id-inconsistencia">Inconsistencia pendiente</label>
          <select id="f-id-inconsistencia" class="form-select"></select>
        </div>

        <!-- SUSTITUTO -->
        <div class="form-group" id="sustitutos-container" style="display: none;">
          <label class="form-label" for="f-id-sustituto">Sustituto disponible</label>
          <select id="f-id-sustituto" class="form-select"></select>
        </div>

      </div>

      <!-- FOOTER -->
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="ui.cerrarModal('modal-cobertura')">
          Cancelar
        </button>

        <button class="btn btn-primary" onclick="coberturasModule.guardar()">
          Asignar
        </button>
      </div>

    </div>
  </div>

  <!-- ===================================================== -->
  <!-- JAVASCRIPT                                             -->
  <!-- ===================================================== -->
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/cookie-consent.js"></script>
  <script src="../js/modules/coberturas.js"></script>

</body>
</html>
