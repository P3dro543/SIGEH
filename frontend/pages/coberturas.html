<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remplazos – SIGEH</title>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <!-- Tom Select -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
  <div class="layout-navbar">
    <div id="navbar-container"></div>

    <main class="page-body-navbar">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <h1 class="page-title">Reemplazos</h1>
        <button class="btn btn-primary" onclick="coberturasModule.abrirModal()">+ Nuevo Reemplazo</button>
      </div>

      <div class="card">
        <div id="tabla-coberturas"></div>
      </div>
    </main>
  </div>

  <!-- Modal nueva cobertura -->
  <div id="modal-cobertura" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Asignar reemplazo</h3>
        <button class="modal-close" onclick="ui.cerrarModal('modal-cobertura')">&times;</button>
      </div>

      <div class="modal-body">
        <div id="cobertura-error" class="alert alert-error"></div>

        <div class="form-group">
          <label class="form-label">Inconsistencia pendiente</label>
          <select id="f-id-inconsistencia" class="form-select"></select>
        </div>

        <div class="form-group" id="sustitutos-container" style="display:none;">
          <label class="form-label">Sustituto disponible</label>
          <select id="f-id-sustituto" class="form-select"></select>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="ui.cerrarModal('modal-cobertura')">Cancelar</button>
        <button class="btn btn-primary" onclick="coberturasModule.guardar()">Asignar</button>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/modules/coberturas.js"></script>
</body>
</html>
