<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permisos – SIGEH</title>
  <meta property="og:title" content="Permisos | SIGEH" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.min.css">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
  <div class="layout-navbar">
    <div id="navbar-container"></div>

    <main class="page-body-navbar">
      <header class="page-header">
        <div><h1 class="page-title">Permisos</h1><p class="page-subtitle">Gestioná solicitudes y mantené un historial claro de aprobaciones.</p></div>
        <button class="btn btn-primary" onclick="permisosModule.abrirModal()">
          + Nuevo permiso
        </button>
      </header>

      <!-- Filtros -->
      <div class="card" style="margin-bottom:1.25rem;">
        <div class="card-body" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
          <div class="form-group" style="flex:2;margin-bottom:0;">
            <label class="form-label">Buscar</label>
            <input
              id="filtro-busqueda"
              type="text"
              class="form-input"
              placeholder="Nombre, cédula..."
              oninput="permisosModule.filtrar()"
            />
          </div>

          <div class="form-group" style="flex:1;margin-bottom:0;">
            <label class="form-label">Estado</label>
            <select
              id="filtro-estado"
              class="form-select"
              onchange="permisosModule.filtrar()"
            >
              <option value="">Todos</option>
              <option value="pendiente">Pendiente</option>
              <option value="aprobado">Aprobado</option>
              <option value="rechazado">Rechazado</option>
            </select>
          </div>

          <button
            class="btn btn-secondary"
            onclick="permisosModule.limpiarFiltros()"
          >
            Limpiar
          </button>
        </div>
      </div>

      <!-- Tabla -->
      <div class="card">
        <div id="tabla-permisos"></div>
      </div>
    </main>
  </div>

  <!-- Modal nuevo permiso -->
  <div id="modal-permiso" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div><h3 class="modal-title">Nuevo permiso</h3><p class="card-description">Registrá el período y motivo de la solicitud.</p></div>
        <button class="modal-close" onclick="ui.cerrarModal('modal-permiso')">&times;</button>
      </div>

      <div class="modal-body">
        <div id="permiso-error" class="alert alert-error"></div>

        <div class="form-group">
          <label class="form-label">Empleado</label>
          <select id="f-id-empleado" class="form-select"></select>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label">Fecha inicio</label>
            <input id="f-fecha-inicio" type="date" class="form-input" />
          </div>

          <div class="form-group">
            <label class="form-label">Fecha fin</label>
            <input id="f-fecha-fin" type="date" class="form-input" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Motivo</label>
          <input
            id="f-motivo"
            type="text"
            class="form-input"
            placeholder="Ej: Cita médica"
          />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="ui.cerrarModal('modal-permiso')">
          Cancelar
        </button>
        <button class="btn btn-primary" onclick="permisosModule.guardar()">
          Guardar
        </button>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/cookie-consent.js"></script>
  <script src="../js/modules/permisos.js"></script>
</body>
</html>
